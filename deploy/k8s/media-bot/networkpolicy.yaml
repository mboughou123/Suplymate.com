# Only the worker talks to Ollama and the AI-cache database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-from-media-bot
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ollama
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: media-bot
      ports:
        - port: 11434
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-cache-db-from-media-bot
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-cache-db
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: media-bot
      ports:
        - port: 5432
